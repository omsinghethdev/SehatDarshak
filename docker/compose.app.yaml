# Shared definitions of the web and backend services, used through `extends` by both database
# modes: ../compose.yaml (local MongoDB container) and ../compose.external-db.yaml (external
# MongoDB such as Atlas). Not meant to be run on its own. Paths are relative to this file.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ../client
      args:
        # Fixed at build time (Vite). "/api" keeps the browser on this origin; Nginx forwards it.
        VITE_API_BASE_URL: /api
        VITE_PUBLIC_APP_URL: ${APP_ORIGIN:-http://localhost:8080}
    image: sehatdarshak-web:local
    ports:
      # Localhost only by default. On a server, set WEB_BIND_ADDRESS=0.0.0.0 (see docs/DOCKER.md).
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  backend:
    build: ../server
    image: sehatdarshak-backend:local
    init: true
    environment:
      NODE_ENV: production
      PORT: "5000"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TOKEN_EXPIRES_IN: ${AUTH_TOKEN_EXPIRES_IN:-1h}
      HOSPITAL_TIMEZONE: ${HOSPITAL_TIMEZONE:-Asia/Kolkata}
      # The browser's origin (the web service). Requests arrive same-origin through Nginx.
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      # One reverse proxy (the web service's Nginx) sits in front of the API.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # Not published to the host: the browser reaches the API through the web service.
    expose: ["5000"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    logging: *logging
