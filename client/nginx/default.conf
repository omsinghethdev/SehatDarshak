# SehatDarshak web server (Docker): serves the built single-page app and forwards /api/ to the
# backend service on the private Compose network, so the browser only ever talks to this origin.

# Docker's internal DNS; re-resolving "backend" keeps the proxy working if the container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: same origin for the browser, so no CORS and no Docker-only hostname in the app.
    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends this proxy's view of the client; the API trusts exactly one hop (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Do not advertise the backend framework to browsers.
        proxy_hide_header X-Powered-By;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite's hashed build files never change, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The app shell must always be revalidated so a new deployment is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routes (/dashboard, /scan?…, /queue/tokens/…) all load the app shell.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
